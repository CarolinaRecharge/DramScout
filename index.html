<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0E0B08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Dram Scout</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600;1,700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; width: 100%; }
      body { background: #0E0B08; overscroll-behavior: none; color: #F0E2C8; font-family: 'Courier Prime', monospace; }
      #root { display: flex; flex-direction: column; align-items: center; }
      /* Loading splash — hidden once React mounts */
      #app-loading {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: #0E0B08; z-index: 9999;
      }
      #app-loading .logo { display: flex; align-items: center; justify-content: center; }
      #app-loading .logo-text { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 700; color: #DCA030; letter-spacing: 0.06em; }
      #app-loading .sub  { font-size: 11px; color: #7A6845; letter-spacing: 0.12em; }
      @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
      #app-loading .dot  { width: 6px; height: 6px; border-radius: 50%; background: #C17D0E; animation: pulse 1.4s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <!-- Shown until React mounts; React removes it on first render -->
    <div id="app-loading">
      <div class="logo"><img src="/icon-192.png" alt="Dram Scout" width="80" height="80" style="border-radius:18px" /></div>
      <div class="logo-text">DRAM SCOUT</div>
      <div class="dot"></div>
      <div class="sub">LOADING</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
