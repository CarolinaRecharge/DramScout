<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="geometricPrecision">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#221A0E"/>
      <stop offset="100%" stop-color="#0D0A07"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A020"/>
      <stop offset="100%" stop-color="#9A6108"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#C8820A"/>
    </linearGradient>
    <clipPath id="glassInterior">
      <path d="M 12.2,6 C 11.2,9 8.5,12.5 8,16 C 7.5,19.5 10.5,22 13.2,23 L 13,25 L 10,27 L 22,27 L 19,25 L 18.8,23 C 21.5,22 24.5,19.5 24,16 C 23.5,12.5 20.8,9 19.8,6 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Liquid fill -->
  <rect x="0" y="17" width="32" height="15" fill="url(#liquid)" clip-path="url(#glassInterior)" opacity="0.92"/>

  <!-- Liquid surface shimmer -->
  <path d="M 9.2,17 Q 16,15.5 22.8,17" fill="none" stroke="#F5C842" stroke-width="0.7" stroke-linecap="round" opacity="0.65" clip-path="url(#glassInterior)"/>

  <!-- Glass outline — Glencairn silhouette -->
  <path d="M 11.5,5.5 C 10.5,8.5 8,12 7.5,16 C 7,19.5 10,22.5 13,23.2 L 12.8,25.2 L 9.5,27 L 22.5,27 L 19.2,25.2 L 19,23.2 C 22,22.5 25,19.5 24.5,16 C 24,12 21.5,8.5 20.5,5.5 Z"
        fill="none" stroke="url(#glassStroke)" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Rim -->
  <line x1="11.5" y1="5.5" x2="20.5" y2="5.5" stroke="#F5C842" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="9.5" y1="27" x2="22.5" y2="27" stroke="url(#glassStroke)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Left highlight -->
  <path d="M 11.5,5.5 C 10.5,8.5 8,12 7.5,16" fill="none" stroke="#F5C842" stroke-width="0.5" stroke-linecap="round" opacity="0.4"/>
</svg>
